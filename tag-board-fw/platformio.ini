; 태그인식 보드 펌웨어 (XIAO ESP32S3 Sense)
; - 카메라: AprilTag(tag36h11) 인식 → 의미 해석 → 이동 판단
; - MTF-01P: Micolink 수신(옵티컬플로우 + 거리)
; - 출력: USB 시리얼 JSON 줄 (FC 연결 전 지상 시험용)

[platformio]
default_envs = xiao_esp32s3  ; 그냥 pio run 은 USB 용만 (WiFi 업로드는 -e xiao_esp32s3_ota)

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_8MB.csv
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24  ; BLE 전송 버퍼 (기본 12개로는 연속 알림 중 스택이 굶는다)

; WiFi 로 펌웨어 올리기 (-36~): Mac 을 보드 WiFi(TagBoard-XXXX)에 붙인 뒤
;   pio run -e xiao_esp32s3_ota -t upload
; 비밀번호는 config.h WIFI_AP_PASS 와 같아야 한다. FC 가 아밍돼 있으면 보드가 받지 않는다.
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=tagboard2026
    --port=3232
